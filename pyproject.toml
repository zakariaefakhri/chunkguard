[project]
name = "chunkguard"
version = "0.2.0"
description = "PIC document chunking for RAG with any LLM and embedding model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zakariae Fakhri" }]
requires-python = ">=3.11"
keywords = ["rag", "chunking", "text-splitter", "retrieval", "llm", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0", "sentencex>=1.0.30"]

[project.optional-dependencies]
# .env configuration for any provider. 1.82.7/1.82.8 were compromised on PyPI.
litellm = ["litellm>=1.83.0", "pydantic-settings>=2.2"]
# Token-based chunk limits.
tokens = ["tiktoken>=0.8"]

[project.urls]
Homepage = "https://github.com/zakariaefakhri/chunkguard"
Issues = "https://github.com/zakariaefakhri/chunkguard/issues"
Paper = "https://aclanthology.org/2025.findings-acl.422/"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "litellm>=1.83.0", "pydantic-settings>=2.2", "tiktoken>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# LiteLLM's own types trigger this Pydantic warning on import.
filterwarnings = ["ignore:.*ReadOnly.*:UserWarning"]
